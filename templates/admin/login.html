{# Extends Django's own login page and only adds the eye button. #}
{% extends "admin/login.html" %}

{% block footer %}
{{ block.super }}
<script>
  (function () {
    // The password input on the admin login form.
    var input = document.getElementById("id_password");
    if (!input) return;

    // Wrap the input so the button can sit inside it, on the right.
    var wrap = document.createElement("div");
    wrap.style.position = "relative";
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    input.style.paddingRight = "40px";

    // The eye button.
    var btn = document.createElement("button");
    btn.type = "button";               // so it never submits the login form
    btn.textContent = "👁";
    btn.setAttribute("aria-label", "Show password");
    btn.style.cssText =
      "position:absolute;right:8px;top:50%;transform:translateY(-50%);" +
      "background:none;border:none;cursor:pointer;font-size:16px;padding:0;";
    wrap.appendChild(btn);

    // Click toggles between hidden dots and visible text.
    btn.addEventListener("click", function () {
      var hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      btn.textContent = hidden ? "🙈" : "👁";
      btn.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });
  })();
</script>
{% endblock %}
